<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta name="theme-color" content="#7ca954" />
    <meta
      name="description"
      content="백구, 황구, 흑구, 우리 강아지와 함께 달리고 점프하는 2D 횡스크롤 모험 게임"
    />
    <title>꼬리의 하루 · 바람 따라 꼬리 따라</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game">
      <canvas
        id="world"
        tabindex="0"
        aria-label="2D 횡스크롤 게임. 좌우 방향키로 달리고 스페이스로 점프해요."
      ></canvas>
      <div id="loading">
        <span>✿</span>
        <p>우리의 산책길을 그리고 있어요…</p>
      </div>
      <section id="start-screen" class="start-screen hidden">
        <header>
          <a href="./">✿ 꼬리의 하루</a
          ><span>작은 발로 떠나는 커다란 모험</span>
        </header>
        <div class="title-block">
          <p class="title-kicker">햇살 좋은 날, 너와 나의 모험</p>
          <h1>바람 따라,<br />꼬리 따라.</h1>
          <p class="title-description">
            풀밭을 달리고, 개울을 폴짝.<br />네가 있어서 모든 길이 놀이터야.
          </p>
        </div>
        <div class="choose-panel">
          <div class="choose-heading">
            <span>오늘의 모험 친구</span
            ><button id="name-edit" title="강아지 이름 변경">
              이름 짓기 ✎
            </button>
          </div>
          <div class="coat-options" id="coat-options">
            <button data-coat="0">
              <canvas width="180" height="140"></canvas><b>백구</b
              ><small>눈처럼 포근한</small></button
            ><button data-coat="1">
              <canvas width="180" height="140"></canvas><b>황구</b
              ><small>햇살을 닮은</small></button
            ><button data-coat="2">
              <canvas width="180" height="140"></canvas><b>흑구</b
              ><small>밤하늘처럼 빛나는</small></button
            ><button data-coat="3">
              <canvas width="180" height="140"></canvas><b>우리 강아지</b
              ><small>사진 속 그 친구</small>
            </button>
          </div>
          <button id="start" class="start-button">
            <span>함께 달리기</span><span>▶</span>
          </button>
          <div class="start-foot">
            <button id="courses">산책길 고르기</button
            ><span>서두르지 않아도 괜찮아.</span
            ><button id="start-help">놀이 방법</button>
          </div>
        </div>
        <span class="art-note">달리고, 뛰고, 함께 자라는 2D 모험</span>
      </section>
      <section id="hud" class="hidden">
        <div class="hud-left">
          <button id="portrait-button" aria-label="강아지 선택 화면">
            <canvas id="portrait" width="100" height="100"></canvas>
          </button>
          <div>
            <b id="dog-name">보리</b><small id="growth-name">아기 강아지</small>
            <div class="xp-track"><i id="xp"></i></div>
          </div>
          <span class="hearts" aria-label="편안한 모험">♥ ♥ ♥</span>
        </div>
        <div class="course-title">
          <small id="course-number">첫 번째 산책길</small
          ><b id="course-name">햇살 들판</b>
          <div class="distance-track"><i id="distance"></i></div>
        </div>
        <div class="hud-right">
          <span class="treat-counter">✦ <b id="treats">0</b></span
          ><button id="sound" aria-label="효과음 켜기">♫</button
          ><button id="pause" aria-label="일시 정지">Ⅱ</button>
        </div>
      </section>
      <div id="controls" class="hidden">
        <div class="move-buttons">
          <button id="left" aria-label="왼쪽으로 달리기">◀</button
          ><button id="right" aria-label="오른쪽으로 달리기">▶</button>
        </div>
        <div class="action-buttons">
          <button id="run" aria-label="빠르게 달리기">달리기</button
          ><button id="jump" aria-label="점프">↟<small>점프</small></button>
        </div>
      </div>
      <div id="keyboard-hint" class="hidden">
        <kbd>←</kbd><kbd>→</kbd> 달리기 <span></span><kbd>Space</kbd> 점프
        <span></span><kbd>Shift</kbd> 빠르게 <span></span><kbd>E</kbd> 놀기
      </div>
      <button id="interact" class="hidden">
        <kbd>E</kbd><span>놀기</span>
      </button>
      <div id="toast" role="status"></div>
      <div id="save-note" class="hidden">발자국을 저장했어요</div>
      <dialog id="dialog">
        <button id="close" aria-label="닫기">×</button>
        <div id="dialog-content"></div>
      </dialog>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
